<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crossy Tracing</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
      }

      #game {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 4 / 3;
        background: #000;
      }

      #status {
        position: fixed;
        inset: auto 0 1rem;
        margin: 0;
        color: #fff;
        font: 14px system-ui, sans-serif;
        text-align: center;
      }

      #metrics {
        position: fixed;
        inset: 0.75rem auto auto 0.75rem;
        padding: 0.4rem 0.55rem;
        color: #d7ffd7;
        background: rgb(0 0 0 / 72%);
        font: 12px ui-monospace, monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="816" height="612" aria-label="Crossy Tracing"></canvas>
    <output id="metrics">Midiendo rendimiento WASM…</output>
    <p id="status">Cargando Crossy Tracing…</p>
    <script type="module">
      import init from "./pkg/crossy_tracing.js";

      const status = document.querySelector("#status");

      try {
        await init();
        status.remove();
      } catch (error) {
        console.error(error);
        status.textContent = "No se pudo iniciar el juego.";
      }
    </script>
  </body>
</html>
