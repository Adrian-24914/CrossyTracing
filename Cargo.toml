[package]
name = "creative_zone"
version = "0.1.0"
edition = "2021"

[lib]
name = "crossy_tracing"
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.34.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "Event",
    "EventTarget",
    "GainNode",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "Performance",
    "Response",
    "Window",
]

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
